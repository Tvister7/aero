consumes:
- application/json
definitions:
  AttendanceInput:
    description: Отметка явки. true ставит или подтверждает явку, false снимает активную.
      Поле обязательно. Повтор true и снятие при отсутствии явки баланс не меняют.
    properties:
      arrived:
        example: true
        type: boolean
    type: object
  AttendanceResponse:
    description: Явка после отметки. attendance равен null, если активной явки нет.
    properties:
      attendance:
        allOf:
        - $ref: '#/definitions/AttendanceView'
        x-nullable: true
      balance:
        example: 3
        type: integer
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
      ok:
        example: true
        type: boolean
    type: object
  AttendanceView:
    description: 'Активная явка. payment: paid, если до списания баланс был больше
      нуля, иначе unpaid.'
    properties:
      marked_at:
        example: "2026-09-03T19:05:00+04:00"
        type: string
      payment:
        enum:
        - paid
        - unpaid
        example: paid
        type: string
    type: object
  BookedResponse:
    description: Запись создана. Баланс в этом ответе ещё прежний.
    properties:
      balance:
        example: 4
        type: integer
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
      class:
        $ref: '#/definitions/ClassView'
      ok:
        example: true
        type: boolean
    type: object
  CancelledResponse:
    description: Запись отменена.
    properties:
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
      ok:
        example: true
        type: boolean
    type: object
  ClassInput:
    description: 'Разовое занятие. capacity можно не передавать: берётся вместимость
      типа.'
    properties:
      capacity:
        example: 6
        type: integer
      starts_at:
        example: "2026-09-12T19:00:00+04:00"
        type: string
      trainer_id:
        example: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        type: string
      training_type_id:
        example: 6ba7b812-9dad-11d1-80b4-00c04fd430c8
        type: string
    type: object
  ClassPatch:
    description: Перенос слота или его отмена. Если status равен cancelled, остальные
      поля игнорируются. Вернуть слот в scheduled этим объектом нельзя. capacity ниже
      числа текущих записей не принимается.
    properties:
      capacity:
        example: 8
        type: integer
      starts_at:
        example: "2026-09-12T20:00:00+04:00"
        type: string
      status:
        enum:
        - cancelled
        example: cancelled
        type: string
      title:
        example: Aero Yoga
        type: string
      trainer_id:
        example: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        type: string
    type: object
  ClassResponse:
    description: Ответ с одним занятием.
    properties:
      data:
        $ref: '#/definitions/ClassView'
      ok:
        example: true
        type: boolean
    type: object
  ClassView:
    description: Занятие в ответе API. У клиента поля status нет. В админском расписании,
      создании, правке и журнале status равен scheduled или cancelled. price_min и
      price_max — снимок подписи на момент слота. На баланс они не переводятся.
    properties:
      booked:
        description: Число записей со статусом booked.
        example: 2
        type: integer
      capacity:
        example: 6
        type: integer
      ends_at:
        example: "2026-09-03T20:00:00+04:00"
        type: string
      free_places:
        example: 4
        type: integer
      id:
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
      price_max:
        example: "40.00"
        type: string
      price_min:
        example: "17.00"
        type: string
      starts_at:
        description: Начало, Asia/Tbilisi, ISO-8601 со смещением +04:00.
        example: "2026-09-03T19:00:00+04:00"
        type: string
      status:
        description: Только админские ответы. У клиента поле отсутствует.
        enum:
        - scheduled
        - cancelled
        example: scheduled
        type: string
      title:
        example: Aero Yoga
        type: string
      trainer:
        $ref: '#/definitions/TrainerRef'
    type: object
  ClassesResponse:
    description: Ответ со списком занятий по starts_at.
    properties:
      data:
        items:
          $ref: '#/definitions/ClassView'
        type: array
      ok:
        example: true
        type: boolean
    type: object
  ClientCard:
    description: Клиент и его проводки, новые сверху.
    properties:
      balance:
        example: 4
        type: integer
      id:
        example: 6ba7b815-9dad-11d1-80b4-00c04fd430c8
        type: string
      ledger:
        items:
          $ref: '#/definitions/LedgerView'
        type: array
      name:
        example: Анна
        type: string
      phone:
        example: "+995555000000"
        type: string
      policy:
        enum:
        - postpay
        - restricted
        example: postpay
        type: string
      telegram_id:
        example: "1001"
        type: string
      username:
        example: anna
        type: string
    type: object
  ClientResponse:
    description: Карточка клиента.
    properties:
      data:
        $ref: '#/definitions/ClientCard'
      ok:
        example: true
        type: boolean
    type: object
  ClientSummary:
    description: Строка списка клиентов.
    properties:
      balance:
        example: 4
        type: integer
      id:
        example: 6ba7b815-9dad-11d1-80b4-00c04fd430c8
        type: string
      name:
        example: Анна
        type: string
      phone:
        example: "+995555000000"
        type: string
      policy:
        enum:
        - postpay
        - restricted
        example: postpay
        type: string
      telegram_id:
        example: "1001"
        type: string
      username:
        example: anna
        type: string
    type: object
  ClientsResponse:
    description: Список клиентов.
    properties:
      data:
        items:
          $ref: '#/definitions/ClientSummary'
        type: array
      ok:
        example: true
        type: boolean
    type: object
  ErrorBody:
    description: 'Ошибка API. ok всегда false. Тексты: UNAUTHORIZED «Откройте приложение
      заново из Telegram», FORBIDDEN «Недостаточно прав», VALIDATION «Проверьте поля»,
      CLASS_NOT_FOUND «Занятие не найдено», NEW_CLASS_NOT_FOUND «Новое занятие недоступно»,
      BOOKING_NOT_FOUND «Запись не найдена», CLASS_STARTED «Занятие уже началось»,
      NO_PLACES «Свободных мест нет», ALREADY_BOOKED «Вы уже записаны», CUTOFF_EXCEEDED
      «Отмена и перенос доступны не позднее чем за 6 часов», SAME_CLASS «Это то же
      занятие», NO_CREDITS «Занятия на балансе закончились», ATTENDANCE_TOO_EARLY
      «Отметить явку можно за 30 минут до начала», INTERNAL «Не удалось выполнить
      запрос».'
    properties:
      error_code:
        enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - VALIDATION
        - CLASS_NOT_FOUND
        - NEW_CLASS_NOT_FOUND
        - BOOKING_NOT_FOUND
        - CLASS_STARTED
        - NO_PLACES
        - ALREADY_BOOKED
        - CUTOFF_EXCEEDED
        - SAME_CLASS
        - NO_CREDITS
        - ATTENDANCE_TOO_EARLY
        - INTERNAL
        example: NO_CREDITS
        type: string
      message:
        example: Занятия на балансе закончились
        type: string
      ok:
        example: false
        type: boolean
    type: object
  GrantInput:
    description: Начисление занятий. delta — целое не меньше 1. Каждый вызов пишет
      новую проводку grant.
    properties:
      delta:
        example: 8
        type: integer
      note:
        example: пакет сентябрь
        type: string
    type: object
  LedgerView:
    description: Проводка баланса. delta +N начисляет занятия, −1 списывает явку,
      +1 возвращает снятие явки. booking_id пустой у начисления.
    properties:
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
        x-nullable: true
      created_at:
        example: "2026-09-01T12:00:00+04:00"
        type: string
      delta:
        example: 8
        type: integer
      id:
        example: 6ba7b816-9dad-11d1-80b4-00c04fd430c8
        type: string
      note:
        example: пакет сентябрь
        type: string
      reason:
        enum:
        - grant
        - attend
        - reversal
        example: grant
        type: string
    type: object
  Me:
    description: Профиль человека, открывшего Mini App. id наружу не отдаётся.
    properties:
      balance:
        description: Сумма проводок. Запись на занятие это число не уменьшает.
        example: 4
        type: integer
      is_admin:
        example: false
        type: boolean
      name:
        example: Анна
        type: string
      phone:
        example: "+995555000000"
        type: string
      policy:
        description: postpay разрешает запись в долг. restricted запрещает запись
          при балансе 0 и ниже.
        enum:
        - postpay
        - restricted
        example: postpay
        type: string
      username:
        example: anna
        type: string
    type: object
  MeResponse:
    description: Ответ с профилем.
    properties:
      data:
        $ref: '#/definitions/Me'
      ok:
        example: true
        type: boolean
    type: object
  MyBooking:
    description: Будущая запись клиента.
    properties:
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
      class:
        $ref: '#/definitions/ClassView'
    type: object
  MyBookingsResponse:
    description: Будущие записи клиента.
    properties:
      data:
        items:
          $ref: '#/definitions/MyBooking'
        type: array
      ok:
        example: true
        type: boolean
    type: object
  OpenedResponse:
    description: Отметка открытия приложения принята.
    properties:
      ok:
        example: true
        type: boolean
    type: object
  PolicyInput:
    description: 'Режим баланса: postpay или restricted.'
    properties:
      policy:
        enum:
        - postpay
        - restricted
        example: restricted
        type: string
    type: object
  ProfileInput:
    description: 'Имя и телефон. Пустая строка и отсутствие поля не стирают сохранённое
      значение. Ник из этого объекта не читается: он берётся из initData.'
    properties:
      name:
        example: Анна
        type: string
      phone:
        example: "+995555000000"
        type: string
    type: object
  RescheduleInput:
    description: Занятие, на которое переносится запись.
    properties:
      class_id:
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
    type: object
  RescheduledResponse:
    description: Запись перенесена на другое занятие.
    properties:
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
      class:
        $ref: '#/definitions/ClassView'
      ok:
        example: true
        type: boolean
    type: object
  Roster:
    description: 'Журнал занятия: слот и записи со статусом booked.'
    properties:
      bookings:
        items:
          $ref: '#/definitions/RosterBooking'
        type: array
      class:
        $ref: '#/definitions/ClassView'
    type: object
  RosterBooking:
    description: Одна запись в журнале занятия. attendance равен null, пока явку не
      поставили.
    properties:
      attendance:
        allOf:
        - $ref: '#/definitions/AttendanceView'
        x-nullable: true
      booking_id:
        example: 6ba7b814-9dad-11d1-80b4-00c04fd430c8
        type: string
      client_id:
        example: 6ba7b815-9dad-11d1-80b4-00c04fd430c8
        type: string
      name:
        example: Анна
        type: string
      phone:
        example: "+995555000000"
        type: string
      username:
        example: anna
        type: string
    type: object
  RosterResponse:
    description: Журнал занятия.
    properties:
      data:
        $ref: '#/definitions/Roster'
      ok:
        example: true
        type: boolean
    type: object
  Stats:
    description: Сводка за включительный диапазон дат Asia/Tbilisi.
    properties:
      arrivals:
        example: 70
        type: integer
      bookings_cancelled:
        example: 12
        type: integer
      bookings_created:
        example: 90
        type: integer
      from:
        example: "2026-09-01"
        type: string
      no_shows:
        example: 8
        type: integer
      to:
        example: "2026-09-30"
        type: string
      unique_users:
        example: 40
        type: integer
      unpaid_visits:
        example: 5
        type: integer
    type: object
  StatsResponse:
    description: Сводка периода.
    properties:
      data:
        $ref: '#/definitions/Stats'
      ok:
        example: true
        type: boolean
    type: object
  Studio:
    description: Контакты. Пустая строка значит «не заполнено». В PUT нужны все пять
      полей.
    properties:
      address:
        example: ул. Пример, 1
        type: string
      contact_url:
        example: https://t.me/aero
        type: string
      instagram_url:
        example: https://instagram.com/aero
        type: string
      map_url:
        example: https://maps.example/aero
        type: string
      phone:
        example: "+995555000000"
        type: string
    type: object
  StudioResponse:
    description: Ответ с карточкой студии.
    properties:
      data:
        $ref: '#/definitions/Studio'
      ok:
        example: true
        type: boolean
    type: object
  Template:
    description: 'Еженедельный слот. weekday: 1 понедельник … 7 воскресенье. start_time
      — местное HH:MM.'
    properties:
      active:
        example: true
        type: boolean
      capacity:
        example: 6
        type: integer
      id:
        example: 6ba7b813-9dad-11d1-80b4-00c04fd430c8
        type: string
      start_time:
        example: "19:00"
        type: string
      title:
        example: Aero Yoga
        type: string
      trainer_id:
        example: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        type: string
      training_type_id:
        example: 6ba7b812-9dad-11d1-80b4-00c04fd430c8
        type: string
      weekday:
        example: 4
        type: integer
    type: object
  TemplateInput:
    description: Поля шаблона. При создании нужны trainer_id, training_type_id, weekday
      и start_time. capacity можно опустить. title копируется с типа. Правка шаблона
      не меняет уже созданные занятия.
    properties:
      active:
        example: true
        type: boolean
      capacity:
        example: 6
        type: integer
      start_time:
        example: "19:00"
        type: string
      trainer_id:
        example: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        type: string
      training_type_id:
        example: 6ba7b812-9dad-11d1-80b4-00c04fd430c8
        type: string
      weekday:
        example: 4
        type: integer
    type: object
  TemplateResponse:
    description: Один шаблон.
    properties:
      data:
        $ref: '#/definitions/Template'
      ok:
        example: true
        type: boolean
    type: object
  TemplatesResponse:
    description: Список шаблонов.
    properties:
      data:
        items:
          $ref: '#/definitions/Template'
        type: array
      ok:
        example: true
        type: boolean
    type: object
  Trainer:
    description: Тренер студии.
    properties:
      active:
        description: false скрывает тренера из новых шаблонов. Уже созданные занятия
          остаются.
        example: true
        type: boolean
      id:
        example: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        type: string
      name:
        description: Имя на экране расписания. Уникально.
        example: Лилия
        type: string
    type: object
  TrainerInput:
    description: Новый тренер. После создания active равен true.
    properties:
      name:
        example: Лилия
        type: string
    type: object
  TrainerPatch:
    description: Правка тренера. Отсутствующее поле не меняется. Чужое занятое имя
      отклоняется.
    properties:
      active:
        example: false
        type: boolean
      name:
        example: Лилия
        type: string
    type: object
  TrainerRef:
    description: Тренер внутри занятия.
    properties:
      id:
        example: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        type: string
      name:
        example: Лилия
        type: string
    type: object
  TrainerResponse:
    description: Один тренер.
    properties:
      data:
        $ref: '#/definitions/Trainer'
      ok:
        example: true
        type: boolean
    type: object
  TrainersResponse:
    description: Список тренеров.
    properties:
      data:
        items:
          $ref: '#/definitions/Trainer'
        type: array
      ok:
        example: true
        type: boolean
    type: object
  TrainingType:
    description: Вид занятия. Цена — подпись на экране, не число занятий на балансе.
    properties:
      active:
        example: true
        type: boolean
      capacity:
        description: Вместимость по умолчанию для новых шаблонов и разовых занятий.
        example: 6
        type: integer
      duration_minutes:
        description: Длительность одного слота, от 1 до 600 минут.
        example: 60
        type: integer
      id:
        example: 6ba7b812-9dad-11d1-80b4-00c04fd430c8
        type: string
      price_max:
        description: Верхняя подпись стоимости, не меньше price_min.
        example: "40.00"
        type: string
      price_min:
        description: Нижняя подпись стоимости, два знака после точки.
        example: "17.00"
        type: string
      title:
        example: Aero Yoga
        type: string
    type: object
  TypeInput:
    description: Поля вида занятия без id. При создании нужны title, duration_minutes,
      capacity, price_min и price_max. При правке передаются только меняющиеся поля.
      Уже созданные слоты правка не переписывает.
    properties:
      active:
        example: true
        type: boolean
      capacity:
        example: 6
        type: integer
      duration_minutes:
        example: 60
        type: integer
      price_max:
        example: "40.00"
        type: string
      price_min:
        example: "17.00"
        type: string
      title:
        example: Aero Stretching
        type: string
    type: object
  TypeResponse:
    description: Один вид занятия.
    properties:
      data:
        $ref: '#/definitions/TrainingType'
      ok:
        example: true
        type: boolean
    type: object
  TypesResponse:
    description: Список видов занятий.
    properties:
      data:
        items:
          $ref: '#/definitions/TrainingType'
        type: array
      ok:
        example: true
        type: boolean
    type: object
  WeekInput:
    description: Неделя генерации. Пустой week_start — понедельник следующей ISO-недели
      в Тбилиси. Переданная дата приводится к понедельнику своей недели.
    properties:
      week_start:
        example: "2026-09-14"
        type: string
    type: object
  WeekResponse:
    description: Итог генерации недели. Поля лежат рядом с ok, не внутри data.
    properties:
      created:
        example: 8
        type: integer
      ok:
        example: true
        type: boolean
      updated:
        example: 2
        type: integer
      week_end:
        example: "2026-09-20"
        type: string
      week_start:
        example: "2026-09-14"
        type: string
    type: object
info:
  contact: {}
  description: Запись, баланс в занятиях и админка. Кроме страницы Swagger каждый
    запрос требует Authorization.
  title: Aero API
  version: "1"
paths:
  /admin/bookings/{id}/attendance:
    post:
      description: Не раньше чем за 30 минут до начала. Списание одно на активную
        явку. Снятие пишет обратную проводку.
      parameters:
      - description: Идентификатор записи
        in: path
        name: id
        required: true
        type: string
      - description: Пришёл или снять отметку
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AttendanceInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AttendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorBody'
      security:
      - TMA: []
      summary: Отметить явку
      tags:
      - Админ
  /admin/classes:
    post:
      description: template_id остаётся пустым. Название, длительность и подпись стоимости
        снимаются с типа.
      parameters:
      - description: Слот
