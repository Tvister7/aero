services:
  aero:
    build: .
    image: aero:local
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ADDR: 0.0.0.0:8181
      DATA_PATH: /data/aero.db
    ports:
      - "8181:8181"
    volumes:
      - aero-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - aero

  seed:
    build: .
    image: aero:local
    profiles: ["seed"]
    environment:
      DATA_PATH: /data/aero.db
    volumes:
      - aero-data:/data
      - ./sql/seed_data.sql:/seed/seed_data.sql:ro
    command: ["seed", "/seed/seed_data.sql"]
    restart: "no"

volumes:
  aero-data:
