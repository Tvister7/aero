services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: aero
      POSTGRES_DB: aero
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero"]
      interval: 2s
      timeout: 5s
      retries: 20

  aero:
    build: .
    image: aero:local
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ADDR: 0.0.0.0:8181
      DATABASE_URL: postgres://aero:aero@postgres:5432/aero?sslmode=disable
      BACKUP_DIR: /backups
    ports:
      - "8181:8181"
    volumes:
      - aero-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on:
      - aero

  seed:
    build: .
    image: aero:local
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgres://aero:aero@postgres:5432/aero?sslmode=disable
    volumes:
      - ./sql/seed_data.sql:/seed/seed_data.sql:ro
    command: ["seed", "/seed/seed_data.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  pgload:
    image: dimitri/pgloader:v3.6.7
    profiles: ["migrate"]
    volumes:
      - aero-data:/data:ro
      - ./sql/pgloader.load:/pgloader.load:ro
    command: ["pgloader", "/pgloader.load"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  aero-backups:
  aero-data:
